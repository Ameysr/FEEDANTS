services:
  mongo:
    image: mongo:7
    container_name: feedants-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single-node replica set. Use this instead of `mongo` when you want MongoDB
  # multi-document transactions enabled locally (matches Atlas behaviour).
  # Start with:  docker compose --profile rs up -d mongo-rs
  mongo-rs:
    image: mongo:7
    container_name: feedants-mongo-rs
    profiles: ["rs"]
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo-rs-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  mongo-rs-data:
